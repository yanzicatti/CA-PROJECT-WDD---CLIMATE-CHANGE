<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Action Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header class="border-bottom border-secondary py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <a href="index.html" class="d-flex align-items-center justify-content-center">
                <img src="logo.png" alt="Climate Action" class="img-fluid">
            </a>
            <nav class="nav">
                <a class="nav-link text-dark" href="index.html">Home</a>
                <a class="nav-link text-dark" href="learn.html">Learn</a>
                <a class="nav-link text-dark" href="takeaction.html">Take Action</a>
                <a class="nav-link text-dark" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>
    
    <!-- Main content -->
    <main class="container my-5 flex-grow-1">
        <div class="row">
            <div class="col-lg-6">
                <h1 class="fw-bold mb-4">Contact us</h1>
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="message" class="form-label">Message</label>
                        
                        <textarea class="form-control " id="message" rows="4" required>
                        </textarea>
                    </div>
                    <button type="submit" class="btn btn-dark px-5">Send</button>
                </form>
            </div>
        </div>
    </main>

  <!-- Footer -->
  <footer class="footer-bar border-top py-4 ">
    <div class="container">
      <small class="text-dark">© 2026 Caue Tachibana Diehl and Yan Zicatti </small>
    </div>
  </footer>
  
</div>
</body>
</html>
