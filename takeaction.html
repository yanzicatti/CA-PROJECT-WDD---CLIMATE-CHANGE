<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Action Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
   
</head>
<body>
    <!-- Header & Navigation -->
    <header class="border-bottom bg-white shadow border-secondary py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <a href="index.html" class="d-flex align-items-center justify-content-center">
                <img src="logo.png" alt="Climate Action" class="img-fluid">
            </a>
            <nav class="nav">
                <a class="nav-link nav-item rounded-4 text-dark" href="index.html">Home</a>
                <a class="nav-link nav-item rounded-4 text-dark" href="learn.html">Learn</a>
                <a class="nav-link nav-item rounded-4 text-dark" href="takeaction.html">Take Action</a>
                <a class="nav-link nav-item rounded-4 text-dark" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>
    

<!-- Main content -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div id="takeactioncheckbox" class="col-lg-9">

                <h1 class="fw-bold title-font mb-2">Take action</h1>
                <p class="mb-4">Tick the things you already do and see how much you are helping the world.</p>

                
                <div class="fact-box-style shadow form-check px-5 py-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="action1">
                    <label class="form-check-label w-100" for="action1">Walk, cycle, or use public transport instead of driving short trips</label>
                </div>
                <div class="fact-box-style shadow form-check px-5 py-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="action2">
                    <label class="form-check-label w-100" for="action2">Switch off lights and unplug devices when not in use</label>
                </div>
                <div class="fact-box-style shadow form-check px-5 py-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="action3">
                    <label class="form-check-label w-100" for="action3">Carry a reusable water bottle and coffee cup</label>
                </div>
                <div class="fact-box-style shadow form-check px-5 py-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="action4">
                    <label class="form-check-label w-100" for="action4">Plan meals to reduce household food waste</label>
                </div>
                <div class="fact-box-style shadow form-check px-5 py-3 mb-3">
                    <input class="form-check-input" type="checkbox" id="action5">
                    <label class="form-check-label w-100" for="action5">Choose plant-based meals at least twice a week</label>
                </div>
                 
                <!--summary box -->

                <div class="p-4 bg-white border rounded shadow-sm text-center" aria-live="polite">
                    <p class="h5 fw-bold mb-2" id="actionCount">You did 0 of 5 actions</p>
                    <div class="progress mb-3" style="height: 24px;">
                        <div id="actionProgress" class="progress-bar bg-success" role="progressbar" 
                        style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%
                        </div>
                    </div>
                        <p class="mb-3 text-muted" id="answercheckbox"></p>
                    <button type="button" id="resetActionsBtn" class="btn btn-outline-secondary btn-sm">Reset Checklist</button>
        
                </div>         
            </div>
        </div>
    </main>

 <!-- Footer -->
    <footer class="footer-bar border-top  border-white py-4 mt-3 ">
        <div class="container">
            <small class="text-dark text-white">© 2026 Caue Tachibana Diehl, Yan Zicatti, Daris Halushko and Yahya Ben
                Taher</small>
        </div>
    </footer>

  <!--javascript connection-->
    <script src="script.js"></script>
</body>
</html>
